option-as-alt = 'both'
confirm-before-quit = false

[cursor]
blinking = true
shape = "Beam"

[effects]
custom-mouse-cursor = false
trail-cursor = true

[fonts]
family = "JetBrainsMono Nerd Font Mono"
size = 15

[navigation]
mode = "Plain"
use-split = false

[renderer]
backend = "Automatic"
performance = "High"

[window]
blur = true
decorations = "Buttonless"
opacity = 0.5
padding-x = 15
padding-y = 15

[hints]
alphabet = "jfkdls;ahgurieowpqtybnmzxcv"

# 1. URL Hint - Open URL in browser
[[hints.rules]]
regex = "(https://|http://)[^\\s]+"
hyperlinks = true
post-processing = true
persist = false
[hints.rules.command]
command = "open"
[hints.rules.binding]
key = "O"
mods = ["Control", "Shift"]

# 2. File Path Hint - Open file in Editor (F)
[[hints.rules]]
regex = "(?:[./\\w\\-_]+/[\\w\\-_]+(?:\\:\\d+)?)"
[hints.rules.command]
command = "sh -c 'file=$0; tmux split-window -h \"nvim ${file%%:*}\" +\"${file##*:}\"'"
[hints.rules.binding]
key = "F"
mods = ["Control", "Shift"]

# 3. Git SHA Hint - Copy commit hash (G)
[[hints.rules]]
regex = "[0-9a-f]{7,40}"
[hints.rules.action]
action = "Copy"
[hints.rules.binding]
key = "G"
mods = ["Control", "Shift"]

# 4. Localhost Hint - Open local dev server link (L)
[[hints.rules]]
regex = "(?:localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0):\\d+"
[hints.rules.command]
command = "open"
[hints.rules.binding]
key = "L"
mods = ["Control", "Shift"]