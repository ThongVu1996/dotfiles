# ==========================================
# RIO TERMINAL CONFIG - MACOS RICING STYLE
# ==========================================

confirm-before-quit = false # Đã set false tại đây
# 1. Hiệu năng & Render
# ------------------------------------------
[renderer]
performance = "High"
backend = "Automatic"
disable-unfocused-render = false

[platform]
macos.renderer.backend = "Metal"

# 2. Font chữ & Hiển thị
# ------------------------------------------
[fonts]
family = "JetBrainsMono Nerd Font"
size = 15
line-height = 1.2

regular = { weight = 500 }
bold = { weight = 800 }
italic = { style = "Italic" }

# 3. Giao diện cửa sổ
# ------------------------------------------
[window]
width = 1000
height = 600
decorations = "Buttonless"
opacity = 0.90
blur = true

[window.padding-x]
left = 10
right = 10

[window.padding-y]
top = 10
bottom = 10

# 4. Điều hướng & Tabs
# ------------------------------------------
[navigation]
mode = "Plain"
clickable = true
use-current-path = true

# 5. Con trỏ (Cursor)
# ------------------------------------------
[cursor]
shape = "beam"
blinking = true

# 6. Shell & Editor
# ------------------------------------------
[shell]
program = "/etc/profiles/per-user/thongvu/bin/nu"
args = ["--login"]

[editor]
program = "nvim"

# 7. Màu sắc (Tokyo Night Storm)
# ------------------------------------------
[colors]
background = '#24283b'
foreground = '#c0caf5'
selection-background = '#364a82'
selection-foreground = '#c0caf5'
cursor = '#c0caf5'
black = '#1d202f'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
blue = '#7aa2f7'
magenta = '#bb9af7'
cyan = '#7dcfff'
white = '#a9b1d6'
light_black = '#414868'
light_red = '#f7768e'
light_green = '#9ece6a'
light_yellow = '#e0af68'
light_blue = '#7aa2f7'
light_magenta = '#bb9af7'
light_cyan = '#7dcfff'
light_white = '#c0caf5'

# [bindings] -> Đã xóa binding Cmd+Q thừa
