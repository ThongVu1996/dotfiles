after-login-command = []
after-startup-command = []

exec-on-workspace-change = [
  'bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = 'move-mouse monitor-lazy-center' 

automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'
[gaps]
inner.horizontal = 4
inner.vertical = 5
outer.left = [{monitor."Built-in Retina Display" = 0}, {monitor.secondary = 25}, {monitor."DELL P2422H" = 10}, 3]
outer.top = [{monitor."Built-in Retina Display" = 0}, {monitor.secondary = 25}, {monitor."DELL P2422H" = 0}, 3]
outer.bottom = [{monitor."Built-in Retina Display" = 0}, {monitor.secondary = 25}, {monitor."DELL P2422H" = 0}, 3]
outer.right = [{monitor."Built-in Retina Display" = 0}, {monitor.secondary = 25}, {monitor."DELL P2422H" = 10}, 3]

[mode.main.binding]

alt-backslash = 'layout tiles horizontal vertical'
alt-equal = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-f = 'fullscreen'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

alt-a = 'workspace A' # Any: Docker, Postman,... 
alt-2 = 'workspace B' # Browser
alt-1 = 'workspace C' # Coding
alt-4 = 'workspace D' # Document/Finder
alt-5 = 'workspace G' # Game
alt-6 = 'workspace M' # Music
alt-n = 'workspace N' # NOTE
alt-r = 'workspace R' # Reading
alt-s = 'workspace S' # Setting
alt-t = 'workspace T' # Terminal
alt-3 = 'workspace V' # Edit Video
alt-w = 'workspace W' # Work: Slack, ggmeet, discord,...
alt-x = 'workspace X' # VM - enjoy

alt-shift-a = 'move-node-to-workspace A'
alt-shift-2 = 'move-node-to-workspace B'
alt-shift-1 = 'move-node-to-workspace C'

alt-shift-d = 'move-node-to-workspace D'
alt-shift-g = 'move-node-to-workspace G'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-n = 'move-node-to-workspace N'
alt-shift-r = 'move-node-to-workspace R'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-3 = 'move-node-to-workspace V'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-x = 'move-node-to-workspace X'

# alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] 
f = ['layout floating tiling', 'mode main'] 
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id ='com.mitchellh.ghostty'
run = "move-node-to-workspace C"

# [[on-window-detected]]
# if.app-id = 'com.github.wez.wezterm'
# run = 'layout floating'

#Browser
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'com.microsoft.edgemac'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = "move-node-to-workspace B"

#Document
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = "move-node-to-workspace D"

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = "move-node-to-workspace W"

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = "move-node-to-workspace R"

[[on-window-detected]]
if.app-id = 'com.apple.iBooksX'
run = "move-node-to-workspace R"

[[on-window-detected]]
if.app-id = 'info.sioyek.sioyek'
run = "move-node-to-workspace R"
 
[[on-window-detected]]
if.app-id = 'notion.id'
run = "move-node-to-workspace N"

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = "move-node-to-workspace N"

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = "move-node-to-workspace N"

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-id = 'com.blackmagic-design.DaVinciResolveLite'
run = 'move-node-to-workspace V'

[[on-window-detected]]
if.app-id = 'com.obsproject.obs-studio'
run = 'move-node-to-workspace V'

[[on-window-detected]]
if.app-id = 'com.vmware.fusion'
run = 'move-node-to-workspace V'

[[on-window-detected]]
if.app-id = 'org.qutebrowser.qutebrowser'
run = ['layout tiling', 'move-node-to-workspace B']

#which work space is on which monitor
[workspace-to-monitor-force-assignment]
W = 1 
C = 'secondary'
V = 'main'
B = 'main'
S = 'main'

