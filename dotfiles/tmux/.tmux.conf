# ==============================================================================
# TMUX CONFIGURATION - TOKYO NIGHT STYLE
# Optimized for Neovim, WezTerm, and Full-Stack Development
# ==============================================================================

# --- 1. General Settings ------------------------------------------------------
set -g status-interval 1        # Refresh status line every 1 second
set -g escape-time 0            # Remove delay after hitting Esc (Critical for Neovim)
set -g repeat-time 500          # Allow multiple commands without re-pressing prefix
set -g display-time 1500        # Duration of status messages (ms)
set -g focus-events on          # Notify applications when tmux pane gains focus
set -g renumber-windows on      # Automatically renumber windows when one is closed
set -g base-index 1             # Start window numbering at 1
setw -g pane-base-index 1       # Start pane numbering at 1
set -g detach-on-destroy off    # Switch to another session when current is destroyed
set -g mouse on                 # Enable mouse support (resizing, selecting)

# --- 2. Terminal & Color Support ----------------------------------------------
set -g default-terminal "tmux-256color"
set -sag terminal-features ",*:RGB"      # Enable TrueColor (24-bit)
set -sag terminal-features ",*:usstyle"  # Enable undercurl/underscore styles
set -as terminal-overrides ",*:RGB"      # Force RGB support
set -g allow-passthrough on              # Required for image.nvim / Yazi previews

# Sync environment variables for image rendering
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- 3. Key Bindings ----------------------------------------------------------
unbind C-b
set -g prefix C-a                # Change prefix to Ctrl-a
bind C-a send-prefix

# Reload configuration quickly
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Pane management
bind x kill-pane                 # Kill current pane
bind -r m resize-pane -Z         # Toggle pane zoom

# Split panes and preserve current path
unbind %
bind '\' split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# Navigation & Resizing (Vim-style)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Advanced Window/Pane movement (Join & Break Panes - Requires Ctrl)
# C-j = Join Horizontal (Merge side-by-side)
# C-k = Join Vertical (Merge top-to-bottom)
# C-b = Break (Move pane to new window)
bind C-j choose-tree -F "#{E:@custom_choose_tree_format}" -Z "join-pane -h -s '%%'"
bind C-k choose-tree -F "#{E:@custom_choose_tree_format}" -Z "join-pane -v -s '%%'"
bind C-b if-shell "[ #{window_panes} -gt 1 ]" { break-pane -a }

# --- 4. Copy Mode (Vi-style) --------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi Escape send-keys -X cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi 'C-f' command-prompt -p "Search forward:" "send -X search-forward '%%'"

# --- 5. Status Bar (Tokyo Night Ribbon Design) --------------------------------
# EXPLANATION:
# This configuration creates a "Centered Ribbon" effect.
# 1. 'status-justify centre' pushes the Window List to the middle.
# 2. 'status-left' uses '#[align=centre]' to push the Session block to the middle,
#    placing it immediately to the left of the Window List.
# 3. 'window-status-separator ""' removes gaps, creating a continuous ribbon.

set -g status on
set -g status-justify centre 
set -g status-style bg=default # Transparent background for Stylix/WezTerm integration
set -g status-left-length 200 
set -g status-right-length 0
set -g status-left ''
set -g status-right ''

# STYLIX COLOR EXPLANATION (BASE16):
# - Green (Success): color2
# - Red (Error/Prefix): color1
# - Yellow (Warning): color3
# - Blue (Info): color4
# - Background (Dark): color0
# - Foreground (Light): color7

# Block 1: Session Info (Red when Prefix is active, Green when normal)
SESSION_BLOCK='#{?client_prefix,#[bg=color1],#[bg=color2]}#[fg=color0]#[fg=color0,bold] 󰌌 #S #[fg=#{?client_prefix,color1,color2},bg=default,nobold]'

# Block 2: Inactive Windows (Using grey/secondary background from Stylix)
WINDOW_FORMAT='#[fg=color0,bg=color10]#[fg=color7,bg=color10] #I #[fg=color10,bg=color8]#[fg=color7,bg=color8]  #W #[fg=color8,bg=default]'

# Block 3: Active Window (Using Aqua or Yellow from Stylix)
CURRENT_WINDOW_FORMAT='#[fg=color0,bg=color4]#[fg=color0,bg=color4,bold] #I #[fg=color4,bg=color6]#[fg=color0,bg=color6,bold]  #W #[fg=color6,bg=default]'

# Apply
set -g status-left '#[align=centre]'$SESSION_BLOCK
set-window-option -g window-status-format "$WINDOW_FORMAT"
set-window-option -g window-status-current-format "$CURRENT_WINDOW_FORMAT"
set-window-option -g window-status-separator ""

# --- 6. Modern Floating Popups -----------------------------------------------
# Instant Popups (No prefix required - Using Alt/Meta key)
# Alt + Space: Floating Terminal
bind-key -n M-Space display-popup -E -w 80% -h 80% -b rounded "zsh"

# Alt + g: Lazygit Popup
bind-key -n M-g     display-popup -E -w 95% -h 95% -b rounded -S "fg=color4,bold" "lazygit"

# Alt + t: Television (Search) Popup
bind-key -n M-t     display-popup -E -w 85% -h 85% -b rounded -S "fg=color2,bold" "tv"

# --- 7. Plugins ---------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'

# Explicit bindings for vim-tmux-navigator (more robust on macOS)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Plugin Settings
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'